[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pycrestron-cip"
dynamic = ["version"]
description = "asyncio client for the Crestron CIP (Crestron-over-IP) panel protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Antonio112009" }]
maintainers = [{ name = "Antonio112009" }]
keywords = ["crestron", "cip", "crestron-over-ip", "xpanel", "home-assistant", "asyncio", "home-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.2", "pytest-cov>=7"]
dev = ["pycrestron-cip[test]", "ruff>=0.16"]

[project.scripts]
pycrestron-cip-probe = "pycrestron_cip.probe:main"

[project.urls]
Homepage = "https://github.com/Antonio112009/pycrestron-cip"
Documentation = "https://github.com/Antonio112009/pycrestron-cip#readme"
"Bug Reports" = "https://github.com/Antonio112009/pycrestron-cip/issues"
Source = "https://github.com/Antonio112009/pycrestron-cip"
Changelog = "https://github.com/Antonio112009/pycrestron-cip/releases"

[tool.hatch.version]
path = "src/pycrestron_cip/__version__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC110"]
